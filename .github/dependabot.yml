version: 2
updates:
  - package-ecosystem: docker
    directory: /.github/ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
