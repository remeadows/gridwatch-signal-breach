name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify expansion save database isolation
        run: |
          docker build --tag signal-breach-save-test .github/ci
          docker run --detach --name signal-breach-save-test \
            --env POSTGRES_PASSWORD=isolated-ci-test-only \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            signal-breach-save-test
          trap 'docker rm --force signal-breach-save-test' EXIT
          for attempt in $(seq 1 30); do
            if docker exec signal-breach-save-test pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec signal-breach-save-test pg_isready -h 127.0.0.1 -U postgres
          docker exec signal-breach-save-test psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f /workspace/scripts/verify-expansion-save-database.sql

      - name: Verify deterministic replay fixtures
        run: |
          npm run typecheck:tools
          npm run verify:assets
          npm run verify:expansion-art
          npm run verify:expansion-art-fallback
          npm run verify:replays
          npm run verify:latency-trap
          npm run verify:rusher
          npm run verify:sapper
          npm run verify:expansion-sim
          npm run verify:expansion-revisions
          npm run verify:expansion-revision-lookup
          npm run verify:expansion-progress-r4
          npm run verify:expansion-checkpoints
          npm run verify:expansion-save-sync
          npm run verify:expansion-save-api
          npm run verify:expansion-r4-drafts
          npm run verify:expansion-canvas
          npm run verify:expansion-r4-evidence
          npm run verify:expansion-retained-evidence
          npm run verify:expansion-visuals
          npm run verify:shield-network
          npm run verify:shield-combat
          npm run verify:preview-policy
          npm run verify:content
          npm run verify:progress
          npm run balance:report
          npm run expansion:balance
          npm run expansion:human-balance
          npm run verify:chapter03-human
          npm run expansion:content-report

      - name: Verify score validator bundle is in sync
        # The Edge Function replays runs with a bundle generated from src/sim.
        # Regenerate it and fail if it drifts from the committed copy, so the
        # server-side anti-cheat can never silently diverge from the game.
        run: |
          npm run build:validator
          git diff --exit-code -- supabase/functions/submit-gridwatch-score/sim.bundle.js \
            || (echo "::error::sim.bundle.js is stale — run 'npm run build:validator' and commit the result." && exit 1)
